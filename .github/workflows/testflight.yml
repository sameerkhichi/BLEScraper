
name: TestFlight

on:
  schedule:
    # TestFlight builds expire after 90 days.
    # Runs at 15:00 UTC on the 1st of every other month.
    - cron: "0 15 1 */2 *"
  workflow_dispatch:

concurrency:
  group: testflight-ios
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build iOS and submit to TestFlight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Write App Store ids into eas.json
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/write-submit-ids.mjs

      - name: Build and submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
